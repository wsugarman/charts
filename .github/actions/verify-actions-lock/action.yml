name: Verify Actions Lockfile
description: Verify that .github/workflows/actions.lock covers every workflow and that each pin still resolves upstream.

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install gh-actions-lock
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # renovate: datasource=github-releases depName=github/gh-actions-lock
        GH_ACTIONS_LOCK_VERSION: v0.4.1
      run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
    - name: Verify lockfile
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh actions-lock --verify
